name: Check Archive Content

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and list files
        run: |
          mkdir -p unzipped
          unzip -o "*.zip" -d unzipped
          echo "=== СПИСОК ВСЕХ ФАЙЛОВ В АРХИВЕ ==="
          find unzipped -maxdepth 3
